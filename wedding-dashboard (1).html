<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruang Persiapan Pernikahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F2E9;
    --paper:#FFFDF9;
    --ink:#2C2620;
    --ink-soft:#6B6154;
    --sage:#7C8A6E;
    --sage-deep:#5C6952;
    --clay:#B8763F;
    --gold:#A8863C;
    --line:#E4DCC9;
    --good:#5C7A52;
    --warn:#B8863C;
    --bad:#AE5A44;
    --radius:14px;
    --shadow:0 1px 2px rgba(44,38,32,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  ::selection{background:var(--sage);color:#fff;}

  /* ---------- Layout shell ---------- */
  #app{min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--line);
    padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin-bottom:2px;}
  .brand-sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:24px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
    color:var(--ink-soft);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:2px;
    border:none;background:none;width:100%;text-align:left;
  }
  .nav-item:hover{background:var(--cream);}
  .nav-item.active{background:var(--sage);color:#fff;}
  .nav-ico{width:18px;text-align:center;font-size:14px;}
  .sidebar-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft);}
  .user-pill{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .logout-link{background:none;border:none;color:var(--clay);font-weight:700;font-size:12px;padding:0;}

  .main{flex:1;min-width:0;padding:26px 30px 90px;}
  .topbar{display:none;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .page-title{font-size:24px;font-weight:600;margin:0;}
  .page-sub{color:var(--ink-soft);font-size:13.5px;margin-top:3px;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .stat-label{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .stat-value{font-size:22px;font-weight:700;font-family:'Fraunces',serif;}
  .stat-value.small{font-size:18px;}
  .stat-note{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;}
  .tag-good{background:#E7EEE2;color:var(--good);}
  .tag-warn{background:#F4EBD8;color:var(--warn);}
  .tag-bad{background:#F5E4DE;color:var(--bad);}
  .tag-neutral{background:var(--cream);color:var(--ink-soft);}

  .progress-track{height:8px;border-radius:99px;background:var(--cream);overflow:hidden;border:1px solid var(--line);}
  .progress-fill{height:100%;background:var(--sage);border-radius:99px;}
  .progress-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}

  .hero-countdown{
    background:linear-gradient(135deg,var(--sage-deep),var(--sage));color:#fff;border-radius:var(--radius);
    padding:26px 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:16px;
  }
  .hero-countdown .num{font-family:'Fraunces',serif;font-size:46px;font-weight:600;line-height:1;}
  .hero-countdown .lbl{font-size:12.5px;letter-spacing:.02em;opacity:.85;margin-top:2px;}
  .hero-countdown .names{font-family:'Fraunces',serif;font-size:20px;font-style:italic;}
  .hero-countdown .date{font-size:13px;opacity:.9;margin-top:2px;}

  .section-title{font-size:16px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;}
  .list-plain{list-style:none;margin:0;padding:0;}
  .task-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .task-row:last-child{border-bottom:none;}
  .task-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--sage);}
  .task-title{font-weight:600;font-size:14px;}
  .task-meta{font-size:12px;color:var(--ink-soft);}
  .act-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .act-row:last-child{border-bottom:none;}
  .act-amt-out{color:var(--bad);font-weight:700;}
  .act-amt-in{color:var(--good);font-weight:700;}
  .insight-row{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .insight-row:last-child{border-bottom:none;}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:13px;color:var(--ink);}
  .btn:hover{background:var(--cream);}
  .btn-primary{background:var(--sage);border-color:var(--sage);color:#fff;}
  .btn-primary:hover{background:var(--sage-deep);}
  .btn-danger{color:var(--bad);}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:8px;}
  .btn-icon{padding:5px 8px;}

  /* ---------- Tables ---------- */
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  th,td{text-align:left;padding:11px 14px;font-size:13.5px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{background:var(--cream);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);font-weight:700;}
  tr:last-child td{border-bottom:none;}
  td.wrap{white-space:normal;}
  .row-actions{display:flex;gap:6px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;justify-content:space-between;}
  .toolbar-left{display:flex;gap:8px;flex-wrap:wrap;}
  .search-input,select.filter{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:13px;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab-btn{background:none;border:none;padding:9px 6px;font-weight:700;font-size:13.5px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--sage-deep);border-bottom-color:var(--sage);}

  .empty-state{padding:44px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state div.big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:12px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .bar-label{width:130px;font-size:12.5px;flex-shrink:0;}
  .bar-track{flex:1;height:16px;background:var(--cream);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
  .bar-fill{height:100%;background:var(--clay);}
  .bar-val{width:110px;text-align:right;font-size:12px;color:var(--ink-soft);flex-shrink:0;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(44,38,32,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--paper);border-radius:16px;padding:22px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 14px;font-size:18px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;}
  .field textarea{min-height:60px;resize:vertical;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--cream);}
  .login-card{background:var(--paper);border-radius:20px;padding:36px 32px;max-width:380px;width:100%;box-shadow:var(--shadow);border:1px solid var(--line);text-align:center;}
  .login-card h1{font-size:23px;margin:6px 0 4px;}
  .login-card p{color:var(--ink-soft);font-size:13.5px;margin-bottom:22px;}
  .who-row{display:flex;gap:10px;margin-bottom:16px;}
  .who-btn{flex:1;padding:14px 8px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:13.5px;}
  .who-btn.sel{border-color:var(--sage);background:#EEF1EA;color:var(--sage-deep);}
  .login-err{color:var(--bad);font-size:12.5px;margin-top:8px;min-height:16px;}

  /* ---------- Mobile ---------- */
  .bottom-nav{display:none;}
  @media(max-width:900px){
    .sidebar{display:none;}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;background:var(--paper);
      border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:20;
    }
    .topbar .brand{margin:0;font-size:16px;}
    .main{padding:16px 14px 84px;}
    .bottom-nav{
      display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);
      z-index:30;overflow-x:auto;padding:6px 4px;
    }
    .bottom-nav .nav-item{flex-direction:column;font-size:10px;gap:3px;padding:6px 10px;min-width:64px;text-align:center;white-space:nowrap;}
    .bottom-nav .nav-item.active{background:none;color:var(--sage-deep);}
    .bottom-nav .nav-ico{font-size:17px;}
    table{min-width:560px;}
  }
  .hint{background:#F4EBD8;border:1px solid #E7D8B2;color:#6B551F;padding:10px 13px;border-radius:10px;font-size:12.5px;margin-bottom:16px;}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .kv:last-child{border-bottom:none;}
  .kv b{font-weight:700;}
  .subcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fffefb;}
  .muted{color:var(--ink-soft);}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* =========================================================
   DATA LAYER
   ========================================================= */
const STORE_KEY = 'wpad_wedding_v1';

function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function defaultChecklist(){
  const M = [
    ['12 Bulan Sebelum', [
      'Tentukan tanggal pernikahan','Tentukan perkiraan anggaran pernikahan','Diskusikan konsep pernikahan',
      'Tentukan perkiraan jumlah tamu','Riset lokasi/venue','Mulai menabung untuk pernikahan']],
    ['8 Bulan Sebelum', [
      'Booking venue','Tentukan tema pernikahan','Riset catering','Riset dekorasi',
      'Riset fotografer/videografer','Tentukan konsep busana pengantin']],
    ['6 Bulan Sebelum', [
      'Booking vendor utama','Mulai menyiapkan dokumen pernikahan','Siapkan daftar tamu',
      'Tentukan konsep undangan','Tentukan mahar','Tentukan seserahan']],
    ['3 Bulan Sebelum', [
      'Finalisasi daftar tamu','Kirim/simpan rencana undangan','Konfirmasi vendor','Pesan busana pengantin',
      'Pesan souvenir','Finalisasi dekorasi','Finalisasi catering']],
    ['1 Bulan Sebelum', [
      'Konfirmasi semua vendor','Finalisasi denah tempat duduk','Konfirmasi kehadiran tamu',
      'Lengkapi administrasi KUA','Siapkan mahar','Siapkan seserahan','Siapkan cincin pernikahan']],
    ['1 Minggu Sebelum', [
      'Konfirmasi akhir vendor','Siapkan sisa pembayaran','Siapkan dokumen pernikahan','Siapkan pakaian',
      'Siapkan kotak darurat','Konfirmasi transportasi','Konfirmasi akomodasi']],
    ['Hari H', [
      'Dokumen pernikahan','Cincin pernikahan','Mahar','Kontak vendor','Busana pengantin',
      'Kotak darurat','Buku tamu','Amplop pembayaran','Barang penting lainnya']],
  ];
  const items = [];
  M.forEach(([milestone, tasks]) => {
    tasks.forEach(t => items.push({
      id: uid(), milestone, task: t, dueDate:'', status:'TODO', priority:'MEDIUM', notes:''
    }));
  });
  return items;
}

function defaultBudgetCategories(){
  return ['Venue','Catering','Dekorasi','Dokumentasi','Rias Pengantin (MUA)','Busana Pengantin','Undangan',
    'Souvenir','Mahar','Seserahan','Hiburan','MC','Wedding Organizer','Transportasi','Akomodasi',
    'Keperluan Ibadah/Akad','Administrasi','Honeymoon','Lain-lain'].map(name=>({id:uid(), name}));
}

function defaultDocuments(){
  const d = [
    ['KTP','Pengantin Pria'], ['KTP','Pengantin Wanita'], ['Kartu Keluarga','Pengantin Pria'],
    ['Kartu Keluarga','Pengantin Wanita'], ['Akta Kelahiran','Pengantin Pria'], ['Akta Kelahiran','Pengantin Wanita'],
    ['Surat Pengantar RT/RW','Bersama'], ['Formulir N1-N4 dari Kelurahan','Bersama'],
    ['Surat Persetujuan Orang Tua','Bersama'], ['Pas Foto','Bersama'], ['Surat Rekomendasi Nikah (jika beda domisili)','Bersama'],
    ['Bukti Pendaftaran Nikah di KUA','Bersama'],
  ];
  return d.map(([name,person]) => ({id:uid(), name, person, status:'Belum Dimulai', deadline:'', notes:''}));
}

function seedData(){
  return {
    settings:{
      groomName:'Calon Mempelai Pria', brideName:'Calon Mempelai Wanita',
      weddingDate:'', weddingLocation:'', engagementDate:'', nikahDate:'', receptionDate:'',
      weddingBudgetTarget:0, savingsTarget:0, password:'nikah2027'
    },
    savingsTransactions: [],
    budgetCategories: defaultBudgetCategories(),
    budgetItems: [],
    checklist: defaultChecklist(),
    guests: [],
    vendors: [],
    documents: defaultDocuments(),
    mahar: [], seserahan: [], souvenir: [],
    honeymoon:{
      budget: [], flights: [], hotels: [], travelDocs: [], itinerary: []
    },
    gifts: [],
    activityLog: []
  };
}

let DATA = null;
function loadData(){
  const raw = localStorage.getItem(STORE_KEY);
  if(!raw){ DATA = seedData(); persist(); }
  else { DATA = JSON.parse(raw); }
  return DATA;
}
function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }
function logActivity(msg){
  DATA.activityLog.unshift({id:uid(), ts:Date.now(), user: currentUserName(), message: msg});
  DATA.activityLog = DATA.activityLog.slice(0,60);
}

/* =========================================================
   HELPERS
   ========================================================= */
function fmtRp(n){
  n = Math.round(Number(n)||0);
  const neg = n<0; n = Math.abs(n);
  let s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'-':'') + 'Rp' + s;
}
function fmtDateID(str){
  if(!str) return '-';
  const d = new Date(str+'T00:00:00');
  if(isNaN(d)) return str;
  return d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
}
function daysBetween(a,b){ return Math.ceil((a-b)/86400000); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sum(arr, fn){ return arr.reduce((a,x)=>a+(Number(fn(x))||0),0); }
function currentUserName(){
  const u = sessionStorage.getItem('wpad_user');
  if(u==='groom') return DATA.settings.groomName || 'Pengantin Pria';
  if(u==='bride') return DATA.settings.brideName || 'Pengantin Wanita';
  return 'Pengguna';
}

/* =========================================================
   ROUTER / STATE
   ========================================================= */
let ROUTE = 'dashboard';
let SUBTAB = {}; // per-page sub tab memory

function navigate(route){ ROUTE = route; render(); window.scrollTo(0,0); }

/* =========================================================
   MODAL SYSTEM
   ========================================================= */
function openModal(title, fields, initial, onSave, onDelete){
  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  let html = `<h3>${esc(title)}</h3><div id="modalFields">`;
  fields.forEach(f=>{
    const val = (initial && initial[f.key]!==undefined) ? initial[f.key] : (f.default!==undefined?f.default:'');
    html += `<div class="field"><label>${esc(f.label)}</label>`;
    if(f.type==='select'){
      html += `<select id="mf_${f.key}">` + f.options.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('') + `</select>`;
    } else if(f.type==='textarea'){
      html += `<textarea id="mf_${f.key}">${esc(val)}</textarea>`;
    } else {
      html += `<input id="mf_${f.key}" type="${f.type||'text'}" value="${esc(val)}" ${f.step?`step="${f.step}"`:''}>`;
    }
    html += `</div>`;
  });
  html += `</div><div class="modal-actions">`;
  if(onDelete){ html += `<button class="btn btn-danger" id="modalDeleteBtn">Hapus</button>`; }
  html += `<button class="btn" id="modalCancelBtn">Batal</button><button class="btn btn-primary" id="modalSaveBtn">Simpan</button></div>`;
  box.innerHTML = html;
  overlay.classList.add('open');
  document.getElementById('modalCancelBtn').onclick = closeModal;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  if(onDelete){
    document.getElementById('modalDeleteBtn').onclick = ()=>{
      if(confirm('Apakah Anda yakin ingin menghapus data ini?')){ onDelete(); closeModal(); render(); }
    };
  }
  document.getElementById('modalSaveBtn').onclick = ()=>{
    const out = {};
    fields.forEach(f=>{ out[f.key] = document.getElementById('mf_'+f.key).value; });
    onSave(out);
    closeModal();
    render();
  };
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }

/* =========================================================
   GENERIC CRUD TABLE
   ========================================================= */
function crudSection(opts){
  // opts: {title, listKey (path in DATA, dot notation), columns:[{key,label,fmt}], fields, emptyText, addLabel, computedExtra}
  const list = getPath(DATA, opts.listKey);
  let html = `<div class="toolbar"><div class="toolbar-left"><h3 style="margin:0;font-size:15px;">${esc(opts.title)}</h3></div>
    <button class="btn btn-primary btn-sm" onclick="crudAdd('${opts.id}')">+ ${esc(opts.addLabel)}</button></div>`;
  if(!list.length){
    html += `<div class="table-wrap"><div class="empty-state"><div class="big">${esc(opts.emptyText)}</div>
      <button class="btn btn-primary" onclick="crudAdd('${opts.id}')">+ ${esc(opts.addLabel)}</button></div></div>`;
  } else {
    html += `<div class="table-wrap"><table><thead><tr>`;
    opts.columns.forEach(c=>html+=`<th>${esc(c.label)}</th>`);
    html += `<th></th></tr></thead><tbody>`;
    list.forEach((row)=>{
      html += `<tr>`;
      opts.columns.forEach(c=>{
        const v = c.fmt ? c.fmt(row) : esc(row[c.key]);
        html += `<td class="${c.wrap?'wrap':''}">${v}</td>`;
      });
      html += `<td><div class="row-actions"><button class="btn btn-sm btn-icon" onclick="crudEdit('${opts.id}','${row.id}')">✎</button></div></td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  return html;
}
window.CRUD_REGISTRY = {};
function registerCrud(id, opts){ window.CRUD_REGISTRY[id] = opts; }
function crudAdd(id){
  const opts = window.CRUD_REGISTRY[id];
  openModal('Tambah '+opts.addLabel, opts.fields, null, (vals)=>{
    const list = getPath(DATA, opts.listKey);
    const row = {id:uid(), ...vals};
    list.push(row);
    logActivity(`${currentUserName()} menambahkan ${opts.addLabel.toLowerCase()}: ${vals[opts.fields[0].key]||''}`);
    persist();
  });
}
function crudEdit(id, rowId){
  const opts = window.CRUD_REGISTRY[id];
  const list = getPath(DATA, opts.listKey);
  const row = list.find(r=>r.id===rowId);
  openModal('Edit '+opts.addLabel, opts.fields, row, (vals)=>{
    Object.assign(row, vals);
    logActivity(`${currentUserName()} memperbarui ${opts.addLabel.toLowerCase()}: ${vals[opts.fields[0].key]||''}`);
    persist();
  }, ()=>{
    const idx = list.findIndex(r=>r.id===rowId);
    list.splice(idx,1);
    logActivity(`${currentUserName()} menghapus ${opts.addLabel.toLowerCase()}`);
    persist();
  });
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function computeMetrics(){
  const S = DATA.settings;
  const today = new Date(); today.setHours(0,0,0,0);
  const wd = S.weddingDate ? new Date(S.weddingDate+'T00:00:00') : null;
  const daysLeft = wd ? daysBetween(wd, today) : null;

  const totalEstimated = sum(DATA.budgetItems, i=>i.estimated);
  const totalActual = sum(DATA.budgetItems, i=>i.actual);
  const totalPaid = sum(DATA.budgetItems, i=>i.paid);
  const totalRemainingPay = sum(DATA.budgetItems, i=>(Number(i.actual)||0)-(Number(i.paid)||0));

  const groomSavings = sum(DATA.savingsTransactions.filter(t=>t.person==='Pengantin Pria'), t=>t.amount);
  const brideSavings = sum(DATA.savingsTransactions.filter(t=>t.person==='Pengantin Wanita'), t=>t.amount);
  const totalSavings = groomSavings + brideSavings;

  const budgetTarget = Number(S.weddingBudgetTarget)||totalEstimated||0;
  const additionalNeeded = Math.max(0, (totalActual||budgetTarget) - totalSavings);

  const checklistTotal = DATA.checklist.length;
  const checklistDone = DATA.checklist.filter(c=>c.status==='COMPLETED').length;
  const checklistPct = checklistTotal? Math.round(checklistDone/checklistTotal*100):0;

  const docsTotal = DATA.documents.length;
  const docsDone = DATA.documents.filter(d=>d.status==='Selesai'||d.status==='Completed').length;
  const docsPct = docsTotal? Math.round(docsDone/docsTotal*100):0;

  const vendorTotal = DATA.vendors.length;
  const vendorSecured = DATA.vendors.filter(v=>v.status==='Kontrak Ditandatangani'||v.status==='Dipilih').length;
  const vendorPct = vendorTotal? Math.round(vendorSecured/vendorTotal*100):0;

  const guestTotal = DATA.guests.length;
  const guestAttending = DATA.guests.filter(g=>g.rsvp==='Hadir');
  const guestDeclined = DATA.guests.filter(g=>g.rsvp==='Tidak Hadir').length;
  const guestPending = DATA.guests.filter(g=>g.rsvp==='Menunggu').length;
  const expectedAttendance = sum(guestAttending, g=>g.attending||1);

  const savingsTarget = Number(S.savingsTarget)||0;
  const savingsPct = savingsTarget? Math.min(100,Math.round(totalSavings/savingsTarget*100)) : 0;

  const financialReadiness = budgetTarget ? Math.min(100, Math.round(totalSavings/budgetTarget*100)) : 0;
  const guestReadiness = guestTotal ? Math.round((guestTotal-guestPending)/guestTotal*100) : 0;
  const prepScore = Math.round((checklistPct+docsPct+vendorPct+guestReadiness+financialReadiness)/5);

  let phase = 'Belum diatur';
  if(daysLeft!==null){
    if(daysLeft<0) phase='Sudah Menikah 🎉';
    else if(daysLeft<=0) phase='Hari H';
    else if(daysLeft<=7) phase='1 Minggu Sebelum';
    else if(daysLeft<=30) phase='1 Bulan Sebelum';
    else if(daysLeft<=90) phase='3 Bulan Sebelum';
    else if(daysLeft<=180) phase='6 Bulan Sebelum';
    else if(daysLeft<=240) phase='8 Bulan Sebelum';
    else phase='12 Bulan Sebelum';
  }

  const giftCash = sum(DATA.gifts.filter(g=>g.type==='Tunai'), g=>g.amount);
  const giftTransfer = sum(DATA.gifts.filter(g=>g.type==='Transfer Bank'), g=>g.amount);
  const giftPhysical = sum(DATA.gifts.filter(g=>g.type==='Barang'), g=>g.amount);
  const giftTotal = giftCash+giftTransfer+giftPhysical;

  return {daysLeft, totalEstimated, totalActual, totalPaid, totalRemainingPay, groomSavings, brideSavings,
    totalSavings, budgetTarget, additionalNeeded, checklistTotal, checklistDone, checklistPct,
    docsTotal, docsDone, docsPct, vendorTotal, vendorSecured, vendorPct, guestTotal, guestDeclined,
    guestPending, expectedAttendance, savingsTarget, savingsPct, prepScore, phase, giftCash, giftTransfer,
    giftPhysical, giftTotal};
}

    <div class="card"><div class="stat-label">Fase Saat Ini</div><div class="stat-value small">${esc(m.phase)}</div></div>
  </div>`;

  html += `<div class="tabs" style="margin-top:20px;flex-wrap:wrap;">
    <button class="tab-btn ${activeTab==='Semua'?'active':''}" onclick="setSubtab('checklist','Semua')">Semua</button>
    ${milestones.map(ms=>`<button class="tab-btn ${activeTab===ms?'active':''}" onclick="setSubtab('checklist','${ms}')">${ms}</button>`).join('')}
  </div>`;

  const filtered = activeTab==='Semua' ? DATA.checklist : DATA.checklist.filter(c=>c.milestone===activeTab);
  if(!filtered.length){
    html += `<div class="table-wrap"><div class="empty-state"><div class="big">Tidak ada tugas pada milestone ini.</div></div></div>`;
  } else {
    html += `<div class="table-wrap"><table><thead><tr><th></th><th>Tugas</th><th>Milestone</th><th>Tenggat</th><th>Prioritas</th><th>Status</th><th></th></tr></thead><tbody>`;
    filtered.forEach(r=>{
      html += `<tr>
        <td><input type="checkbox" ${r.status==='COMPLETED'?'checked':''} onchange="quickCompleteTask('${r.id}')"></td>
        <td>${esc(r.task)}</td><td>${esc(r.milestone)}</td><td>${fmtDateID(r.dueDate)}</td>
        <td><span class="tag ${r.priority==='HIGH'?'tag-bad':r.priority==='LOW'?'tag-neutral':'tag-warn'}">${r.priority}</span></td>
        <td><span class="tag ${r.status==='COMPLETED'?'tag-good':r.status==='IN PROGRESS'?'tag-warn':'tag-neutral'}">${r.status}</span></td>
        <td><button class="btn btn-sm btn-icon" onclick="crudEdit('checklist','${r.id}')">✎</button></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  document.getElementById('app-content').innerHTML = html;
}
function setSubtab(page, val){ SUBTAB[page]=val; render(); }

   ========================================================= */
function renderSettings(){
  const S = DATA.settings;
  let html = `<div class="page-head"><div><h1 class="page-title">Pengaturan</h1><div class="page-sub">Konfigurasi data dasar pernikahan Anda</div></div></div>`;

  html += `<div class="grid grid-2">
    <div class="card">
      <h3 style="margin-top:0;">Informasi Pernikahan</h3>
      <div class="field"><label>Nama Mempelai Pria</label><input id="s_groom" value="${esc(S.groomName)}"></div>
      <div class="field"><label>Nama Mempelai Wanita</label><input id="s_bride" value="${esc(S.brideName)}"></div>
      <div class="field"><label>Tanggal Pernikahan (Resepsi/Utama)</label><input type="date" id="s_wdate" value="${esc(S.weddingDate)}"></div>
      <div class="field"><label>Lokasi Pernikahan</label><input id="s_wloc" value="${esc(S.weddingLocation)}"></div>
      <div class="field"><label>Tanggal Lamaran</label><input type="date" id="s_engage" value="${esc(S.engagementDate)}"></div>
      <div class="field"><label>Tanggal Akad Nikah</label><input type="date" id="s_nikah" value="${esc(S.nikahDate)}"></div>
      <div class="field"><label>Tanggal Resepsi</label><input type="date" id="s_recep" value="${esc(S.receptionDate)}"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Keuangan &amp; Keamanan</h3>
      <div class="field"><label>Target Anggaran Pernikahan (Rp)</label><input type="number" id="s_budget" value="${S.weddingBudgetTarget}"></div>
      <div class="field"><label>Target Tabungan (Rp)</label><input type="number" id="s_savtarget" value="${S.savingsTarget}"></div>
      <div class="field"><label>Mata Uang</label><input value="IDR (Rupiah)" disabled></div>
      <div class="field"><label>Kata Sandi Bersama</label><input id="s_pass" value="${esc(S.password)}"></div>
      <button class="btn btn-primary" id="saveSettingsBtn" style="width:100%;justify-content:center;">Simpan Pengaturan</button>
    </div>
  </div>

  <div class="section-title">Kategori Anggaran</div>
  <div class="card">
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
      ${DATA.budgetCategories.map(c=>`<span class="tag tag-neutral">${esc(c.name)}</span>`).join('')}
    </div>
    <div style="display:flex;gap:8px;">
      <input class="search-input" id="newCatInput" placeholder="Nama kategori baru" style="flex:1;">
      <button class="btn btn-primary btn-sm" id="addCatBtn">Tambah</button>
    </div>
  </div>

  <div class="section-title">Ekspor Data</div>
  <div class="card">
    <p class="muted" style="margin-top:0;">Unduh seluruh data aplikasi sebagai berkas JSON untuk cadangan pribadi.</p>
    <button class="btn" id="exportBtn">⤓ Ekspor Data (JSON)</button>
  </div>

  <div class="hint" style="margin-top:18px;">
    Catatan keamanan: aplikasi ini menyimpan seluruh data secara lokal di peramban perangkat Anda (localStorage) — tidak ada server, sehingga tidak ada data yang terkirim ke pihak lain. Karena itu, data tidak otomatis tersinkron antar perangkat; gunakan tombol ekspor di atas secara berkala untuk mencadangkan data Anda.
  </div>`;

  document.getElementById('app-content').innerHTML = html;

  document.getElementById('saveSettingsBtn').onclick = ()=>{
    S.groomName = document.getElementById('s_groom').value || 'Pengantin Pria';
    S.brideName = document.getElementById('s_bride').value || 'Pengantin Wanita';
    S.weddingDate = document.getElementById('s_wdate').value;
    S.weddingLocation = document.getElementById('s_wloc').value;
    S.engagementDate = document.getElementById('s_engage').value;
    S.nikahDate = document.getElementById('s_nikah').value;
    S.receptionDate = document.getElementById('s_recep').value;
    S.weddingBudgetTarget = Number(document.getElementById('s_budget').value)||0;
    S.savingsTarget = Number(document.getElementById('s_savtarget').value)||0;
    S.password = document.getElementById('s_pass').value || S.password;
    logActivity(`${currentUserName()} memperbarui pengaturan pernikahan`);
    persist();
    render();
  };
  document.getElementById('addCatBtn').onclick = ()=>{
    const v = document.getElementById('newCatInput').value.trim();
    if(v){ DATA.budgetCategories.push({id:uid(), name:v}); persist(); render(); }
  };
  document.getElementById('exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data-pernikahan-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
  };
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render(){
  const app = document.getElementById('app');
  const loggedIn = sessionStorage.getItem('wpad_user');
  if(!loggedIn){ renderLogin(); return; }

  app.innerHTML = `<div class="shell">${shellChrome()}<div class="main"><div id="app-content"></div></div></div>`;
  const doLogout = ()=>{ sessionStorage.removeItem('wpad_user'); render(); };
  document.getElementById('topLogout').onclick = doLogout;
  document.getElementById('sideLogout').onclick = doLogout;

  switch(ROUTE){
    case 'dashboard': renderDashboard(); break;
    case 'budget': renderBudget(); break;
    case 'savings': renderSavings(); break;
    case 'checklist': renderChecklist(); break;
    case 'guests': renderGuests(); break;
    case 'vendors': renderVendors(); break;
    case 'documents': renderDocuments(); break;
    case 'items': renderItems(); break;
    case 'honeymoon': renderHoneymoon(); break;
    case 'settings': renderSettings(); break;
    default: renderDashboard();
  }
}

loadData();
render();
</script>
</body>
</html>
